apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: filebeat
  namespace: logging
  labels:
    app: filebeat
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: logging
    meta.helm.sh/release-namespace: logging

spec:
  revisionHistoryLimit: 10

  selector:
    matchLabels:
      app: filebeat

  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1

  template:
    metadata:
      labels:
        app: filebeat
      annotations:
        kubectl.kubernetes.io/restartedAt: "2026-06-10T17:14:44+07:00"

    spec:
      serviceAccount: filebeat
      serviceAccountName: filebeat
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      terminationGracePeriodSeconds: 30

      containers:
      - name: filebeat
        image: docker.elastic.co/beats/filebeat:8.13.2
        imagePullPolicy: IfNotPresent

        args:
        - -e
        - -strict.perms=false

        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: spec.nodeName

        securityContext:
          runAsUser: 0

        resources: {}

        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File

        volumeMounts:
        - name: varlog
          mountPath: /var/log
          readOnly: true

        - name: varlibdockercontainers
          mountPath: /var/lib/docker/containers
          readOnly: true

        - name: config
          mountPath: /usr/share/filebeat/filebeat.yml
          subPath: filebeat.yml

      volumes:
      - name: varlog
        hostPath:
          path: /var/log
          type: Directory

      - name: varlibdockercontainers
        hostPath:
          path: /var/lib/docker/containers
          type: Directory

      - name: config
        configMap:
          name: filebeat-config
          defaultMode: 420